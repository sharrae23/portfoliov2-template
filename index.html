<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- data-static-meta: for crawlers that do not run JS. main.tsx removes them on boot so each route owns one title + description.
         Keep this head in step with content/site.ts and the Home entry in src/app/routes.ts. -->
    <title data-static-meta>Mary Sharra | Documentation + Operations Support</title>
    <meta data-static-meta name="description" content="Virtual assistance and documentation support for clearer workflows, reliable follow-through, and usable team knowledge." />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preload" href="/fonts/geist-var.woff2" as="font" type="font/woff2" crossorigin />
    <!-- The phone bar's mark is the mobile LCP; dark is the default theme, so its mark loads first. -->
    <link rel="preload" href="/images/brand/mark-light-96.webp" as="image" fetchpriority="high" />
    <meta name="theme-color" content="#F8F6F1" />

    <meta property="og:type" content="website" />
    <!-- Link previews: absolute URLs on your domain. Re-render og-image.png with scripts/make-og-image.mjs. -->
    <meta property="og:site_name" content="Mary Sharra - Documentation + Operations Support" />
    <meta property="og:url" content="https://sharra-portfolio-v2.netlify.app/" />
    <meta property="og:title" content="Mary Sharra | Documentation + Operations Support" />
    <meta property="og:description" content="Virtual assistance and documentation support for clearer workflows, reliable follow-through, and usable team knowledge." />
    <meta property="og:image" content="https://sharra-portfolio-v2.netlify.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Mary Sharra, Documentation + Operations Support" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://example.com/og-image.png" />

    <!-- Light by default; a saved dark pick is applied before first paint. -->
    <script>
      try {
        if (localStorage.getItem('pv2-theme') === 'dark') {
          document.documentElement.dataset.theme = 'dark'
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#181521')
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
